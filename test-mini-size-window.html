<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiniSizeWindow 组件测试</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }

        .demo-container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .demo-title {
            color: white;
            font-size: 28px;
            font-weight: 600;
            margin-bottom: 30px;
            text-align: center;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
        }

        .demo-section {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .demo-section-title {
            color: white;
            font-size: 18px;
            font-weight: 500;
            margin-bottom: 15px;
        }

        .demo-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .demo-item {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .demo-item-title {
            color: rgba(255, 255, 255, 0.9);
            font-size: 14px;
            font-weight: 500;
        }

        .demo-controls {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 10px;
        }

        .demo-button {
            padding: 6px 12px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s;
            backdrop-filter: blur(5px);
        }

        .demo-button:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.5);
        }

        .demo-button.active {
            background: rgba(82, 196, 26, 0.3);
            border-color: #52c41a;
        }

        .floating-demo {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
        }

        .floating-controls {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.8);
            padding: 15px;
            border-radius: 8px;
            backdrop-filter: blur(10px);
            color: white;
            z-index: 999;
        }

        .floating-controls h3 {
            margin: 0 0 10px 0;
            font-size: 14px;
        }
    </style>
</head>

<body>
    <div class="demo-container">
        <h1 class="demo-title">MiniSizeWindow 组件演示</h1>

        <!-- 基本状态演示 -->
        <div class="demo-section">
            <h2 class="demo-section-title">基本状态</h2>
            <div class="demo-grid">
                <div class="demo-item">
                    <div class="demo-item-title">连接中状态</div>
                    <div id="connecting-demo"></div>
                </div>

                <div class="demo-item">
                    <div class="demo-item-title">响铃状态</div>
                    <div id="ringing-demo"></div>
                </div>

                <div class="demo-item">
                    <div class="demo-item-title">通话中状态</div>
                    <div id="connected-demo"></div>
                </div>
            </div>
        </div>

        <!-- 通话类型演示 -->
        <div class="demo-section">
            <h2 class="demo-section-title">通话类型</h2>
            <div class="demo-grid">
                <div class="demo-item">
                    <div class="demo-item-title">视频通话</div>
                    <div id="video-call-demo"></div>
                </div>

                <div class="demo-item">
                    <div class="demo-item-title">语音通话</div>
                    <div id="audio-call-demo"></div>
                </div>

                <div class="demo-item">
                    <div class="demo-item-title">多人视频</div>
                    <div id="multi-video-demo"></div>
                </div>
            </div>
        </div>

        <!-- 交互演示 -->
        <div class="demo-section">
            <h2 class="demo-section-title">交互演示</h2>
            <div class="demo-grid">
                <div class="demo-item">
                    <div class="demo-item-title">可交互窗口</div>
                    <div id="interactive-demo"></div>
                    <div class="demo-controls">
                        <button class="demo-button" onclick="toggleMute()">切换静音</button>
                        <button class="demo-button" onclick="toggleCamera()">切换摄像头</button>
                        <button class="demo-button" onclick="hangup()">挂断</button>
                    </div>
                </div>

                <div class="demo-item">
                    <div class="demo-item-title">简化窗口（无控制）</div>
                    <div id="simple-demo"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- 浮动窗口演示 -->
    <div class="floating-demo" id="floating-demo"></div>

    <!-- 浮动控制面板 -->
    <div class="floating-controls">
        <h3>浮动窗口控制</h3>
        <div class="demo-controls">
            <button class="demo-button" onclick="updateFloatingDuration()">更新时长</button>
            <button class="demo-button" onclick="toggleFloatingMute()">切换静音</button>
            <button class="demo-button" onclick="restoreFloating()">恢复窗口</button>
        </div>
    </div>

    <script type="module">
        import { MiniSizeWindow } from './module/callkit/components/MiniSizeWindow.js';

        // 状态管理
        let interactiveState = {
            muted: false,
            cameraEnabled: true,
            duration: '00:05:23'
        };

        let floatingState = {
            muted: false,
            cameraEnabled: true,
            duration: '00:12:45'
        };

        // 创建 MiniSizeWindow 实例的辅助函数
        function createMiniWindow(container, props) {
            // 清空容器
            container.innerHTML = '';

            // 创建组件实例
            const miniWindow = new MiniSizeWindow({
                prefixCls: 'cui-callkit',
                ...props
            });

            // 渲染到容器
            container.appendChild(miniWindow.render());

            return miniWindow;
        }

        // 初始化所有演示
        function initDemos() {
            // 连接中状态
            createMiniWindow(document.getElementById('connecting-demo'), {
                callStatus: 'connecting',
                callType: 'video',
                participantCount: 1,
                showQuickControls: false,
                clickToRestore: false
            });

            // 响铃状态
            createMiniWindow(document.getElementById('ringing-demo'), {
                callStatus: 'ringing',
                callType: 'video',
                participantCount: 1,
                showQuickControls: false,
                clickToRestore: false
            });

            // 通话中状态
            createMiniWindow(document.getElementById('connected-demo'), {
                callStatus: 'connected',
                callType: 'video',
                participantCount: 1,
                callDuration: '00:03:45',
                showQuickControls: false,
                clickToRestore: false
            });

            // 视频通话
            createMiniWindow(document.getElementById('video-call-demo'), {
                callType: 'video',
                participantCount: 1,
                callDuration: '00:08:12',
                muted: false,
                cameraEnabled: true,
                showQuickControls: true,
                clickToRestore: false
            });

            // 语音通话
            createMiniWindow(document.getElementById('audio-call-demo'), {
                callType: 'audio',
                participantCount: 1,
                callDuration: '00:15:30',
                muted: false,
                showQuickControls: true,
                clickToRestore: false
            });

            // 多人视频
            createMiniWindow(document.getElementById('multi-video-demo'), {
                callType: 'video',
                participantCount: 5,
                callDuration: '00:22:18',
                muted: true,
                cameraEnabled: false,
                showQuickControls: true,
                clickToRestore: false
            });

            // 可交互窗口
            updateInteractiveDemo();

            // 简化窗口
            createMiniWindow(document.getElementById('simple-demo'), {
                callType: 'video',
                participantCount: 2,
                callDuration: '00:01:23',
                showQuickControls: false,
                clickToRestore: true,
                onClick: () => {
                    alert('点击恢复窗口！');
                }
            });

            // 浮动窗口
            updateFloatingDemo();
        }

        // 更新交互演示
        function updateInteractiveDemo() {
            createMiniWindow(document.getElementById('interactive-demo'), {
                callType: 'video',
                participantCount: 1,
                callDuration: interactiveState.duration,
                muted: interactiveState.muted,
                cameraEnabled: interactiveState.cameraEnabled,
                showQuickControls: true,
                clickToRestore: true,
                onClick: () => {
                    console.log('点击恢复窗口');
                },
                onMuteToggle: (muted) => {
                    console.log('静音切换:', muted);
                },
                onCameraToggle: (enabled) => {
                    console.log('摄像头切换:', enabled);
                },
                onHangup: () => {
                    console.log('挂断通话');
                    alert('通话已挂断');
                }
            });
        }

        // 更新浮动演示
        function updateFloatingDemo() {
            createMiniWindow(document.getElementById('floating-demo'), {
                callType: 'video',
                participantCount: 3,
                callDuration: floatingState.duration,
                muted: floatingState.muted,
                cameraEnabled: floatingState.cameraEnabled,
                showQuickControls: true,
                clickToRestore: true,
                onClick: () => {
                    alert('恢复浮动窗口！');
                },
                onMuteToggle: (muted) => {
                    floatingState.muted = muted;
                    updateFloatingDemo();
                },
                onCameraToggle: (enabled) => {
                    floatingState.cameraEnabled = enabled;
                    updateFloatingDemo();
                },
                onHangup: () => {
                    if (confirm('确定要挂断通话吗？')) {
                        document.getElementById('floating-demo').style.display = 'none';
                    }
                }
            });
        }

        // 全局函数
        window.toggleMute = () => {
            interactiveState.muted = !interactiveState.muted;
            updateInteractiveDemo();
        };

        window.toggleCamera = () => {
            interactiveState.cameraEnabled = !interactiveState.cameraEnabled;
            updateInteractiveDemo();
        };

        window.hangup = () => {
            if (confirm('确定要挂断通话吗？')) {
                alert('通话已挂断');
            }
        };

        window.updateFloatingDuration = () => {
            const minutes = Math.floor(Math.random() * 60);
            const seconds = Math.floor(Math.random() * 60);
            floatingState.duration = `00:${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
            updateFloatingDemo();
        };

        window.toggleFloatingMute = () => {
            floatingState.muted = !floatingState.muted;
            updateFloatingDemo();
        };

        window.restoreFloating = () => {
            alert('恢复浮动窗口！');
        };

        // 初始化
        initDemos();

        // 定时更新通话时长
        setInterval(() => {
            // 更新交互演示的时长
            const [hours, minutes, seconds] = interactiveState.duration.split(':').map(Number);
            let totalSeconds = hours * 3600 + minutes * 60 + seconds + 1;

            const newHours = Math.floor(totalSeconds / 3600);
            const newMinutes = Math.floor((totalSeconds % 3600) / 60);
            const newSeconds = totalSeconds % 60;

            interactiveState.duration = `${newHours.toString().padStart(2, '0')}:${newMinutes.toString().padStart(2, '0')}:${newSeconds.toString().padStart(2, '0')}`;
            updateInteractiveDemo();

            // 更新浮动窗口的时长
            const [fHours, fMinutes, fSeconds] = floatingState.duration.split(':').map(Number);
            let fTotalSeconds = fHours * 3600 + fMinutes * 60 + fSeconds + 1;

            const fNewHours = Math.floor(fTotalSeconds / 3600);
            const fNewMinutes = Math.floor((fTotalSeconds % 3600) / 60);
            const fNewSeconds = fTotalSeconds % 60;

            floatingState.duration = `${fNewHours.toString().padStart(2, '0')}:${fNewMinutes.toString().padStart(2, '0')}:${fNewSeconds.toString().padStart(2, '0')}`;
            updateFloatingDemo();
        }, 1000);

        console.log('MiniSizeWindow 组件演示页面已加载');
    </script>
</body>

</html>
