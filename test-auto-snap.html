<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CallKit 自动吸附测试</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }

        .test-container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        .test-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .test-header h1 {
            color: #333;
            margin: 0 0 10px 0;
        }

        .test-header p {
            color: #666;
            margin: 0;
        }

        .test-controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .test-btn {
            padding: 8px 16px;
            border: none;
            border-radius: 6px;
            background: #007bff;
            color: white;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.2s;
        }

        .test-btn:hover {
            background: #0056b3;
        }

        .test-btn.secondary {
            background: #6c757d;
        }

        .test-btn.secondary:hover {
            background: #545b62;
        }

        .test-info {
            background: #f8f9fa;
            border-radius: 6px;
            padding: 15px;
            margin-bottom: 20px;
            border-left: 4px solid #007bff;
        }

        .test-info h3 {
            margin: 0 0 10px 0;
            color: #333;
        }

        .test-info ul {
            margin: 0;
            padding-left: 20px;
        }

        .test-info li {
            margin-bottom: 5px;
            color: #666;
        }

        .position-info {
            background: #e9ecef;
            padding: 10px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 12px;
            margin-top: 10px;
        }

        .demo-area {
            position: relative;
            height: 600px;
            background: #f8f9fa;
            border: 2px dashed #dee2e6;
            border-radius: 8px;
            overflow: hidden;
        }

        .demo-area::before {
            content: "测试区域 - 拖动 CallKit 到不同位置然后点击最小化按钮";
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #6c757d;
            font-size: 16px;
            text-align: center;
            z-index: 1;
            pointer-events: none;
        }
    </style>
</head>

<body>
    <div class="test-container">
        <div class="test-header">
            <h1>CallKit 自动吸附测试</h1>
            <p>测试最小化时的自动吸附功能</p>
        </div>

        <div class="test-info">
            <h3>测试步骤：</h3>
            <ul>
                <li>拖动 CallKit 到屏幕的不同位置</li>
                <li>点击最小化按钮（BOXES 图标）</li>
                <li>观察 CallKit 是否自动吸附到离得最近的边缘</li>
                <li>吸附过程应该有平滑的过渡动画</li>
                <li>点击最小化的窗口可以恢复正常大小</li>
            </ul>
        </div>

        <div class="test-controls">
            <button class="test-btn" onclick="moveCallKit('left')">移动到左侧</button>
            <button class="test-btn" onclick="moveCallKit('right')">移动到右侧</button>
            <button class="test-btn" onclick="moveCallKit('center')">移动到中央</button>
            <button class="test-btn secondary" onclick="resetCallKit()">重置位置</button>
        </div>

        <div class="position-info" id="positionInfo">
            位置信息将在这里显示
        </div>

        <div class="demo-area" id="demoArea">
            <div id="callkit-container"></div>
        </div>
    </div>

    <script type="module">
        import { CallKit } from './module/callkit/CallKit.js';
        import React from 'https://esm.sh/react@18';
        import ReactDOM from 'https://esm.sh/react-dom@18';

        const { useState, useEffect } = React;

        // 模拟视频数据
        const mockVideos = [
            {
                id: 'user1',
                nickname: '张三',
                stream: null,
                isLocalVideo: false,
                muted: false,
                avatar: 'https://via.placeholder.com/100x100/4CAF50/white?text=张'
            },
            {
                id: 'user2',
                nickname: '李四',
                stream: null,
                isLocalVideo: true,
                muted: false,
                avatar: 'https://via.placeholder.com/100x100/2196F3/white?text=李'
            }
        ];

        function TestApp() {
            const [callKitRef, setCallKitRef] = useState(null);
            const [position, setPosition] = useState({ left: 200, top: 100 });
            const [isMinimized, setIsMinimized] = useState(false);

            // 更新位置信息显示
            useEffect(() => {
                const positionInfo = document.getElementById('positionInfo');
                if (positionInfo) {
                    const windowWidth = window.innerWidth;
                    const centerX = windowWidth / 2;
                    const distanceFromLeft = position.left;
                    const distanceFromRight = windowWidth - position.left - 400; // 假设宽度400
                    const closerToLeft = distanceFromLeft < distanceFromRight;

                    positionInfo.innerHTML = `
                        当前位置: left=${position.left}px, top=${position.top}px<br>
                        窗口宽度: ${windowWidth}px, 中心点: ${centerX}px<br>
                        离左边距离: ${distanceFromLeft}px, 离右边距离: ${distanceFromRight}px<br>
                        更靠近: ${closerToLeft ? '左边' : '右边'}<br>
                        最小化状态: ${isMinimized ? '是' : '否'}
                    `;
                }
            }, [position, isMinimized]);

            // 全局移动函数
            window.moveCallKit = (direction) => {
                const demoArea = document.getElementById('demoArea');
                const rect = demoArea.getBoundingClientRect();

                let newPosition;
                switch (direction) {
                    case 'left':
                        newPosition = { left: rect.left + 50, top: position.top };
                        break;
                    case 'right':
                        newPosition = { left: rect.right - 450, top: position.top };
                        break;
                    case 'center':
                        newPosition = { left: rect.left + (rect.width - 400) / 2, top: position.top };
                        break;
                }

                if (newPosition) {
                    setPosition(newPosition);
                }
            };

            // 全局重置函数
            window.resetCallKit = () => {
                setPosition({ left: 200, top: 100 });
                setIsMinimized(false);
            };

            return React.createElement(CallKit, {
                videos: mockVideos,
                managedPosition: true,
                initialPosition: position,
                initialSize: { width: 400, height: 300 },
                minimizedSize: { width: 80, height: 64 },
                resizable: true,
                draggable: true,
                showControls: true,
                callDuration: '05:23',
                onMinimizedChange: (minimized) => {
                    console.log('最小化状态变化:', minimized);
                    setIsMinimized(minimized);
                },
                onDrag: (newPos) => {
                    setPosition({ left: newPos.x, top: newPos.y });
                },
                onMuteToggle: (muted) => console.log('静音切换:', muted),
                onCameraToggle: (enabled) => console.log('摄像头切换:', enabled),
                onHangup: () => console.log('挂断通话'),
                style: {
                    position: 'fixed',
                    zIndex: 1000,
                    boxShadow: '0 10px 30px rgba(0,0,0,0.3)',
                    borderRadius: '12px',
                    overflow: 'hidden'
                }
            });
        }

        // 渲染应用
        ReactDOM.render(React.createElement(TestApp), document.getElementById('callkit-container'));
    </script>
</body>

</html>
