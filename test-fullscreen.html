<!DOCTYPE html>
<html lang="zh">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CallKit 全屏模式测试</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: #f0f0f0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        .container {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: #333;
        }

        /* 模拟 CallKit 样式 */
        .cui-callkit {
            position: absolute;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
        }

        .cui-callkit-normal {
            left: 50px;
            top: 50px;
            width: 800px;
            height: 600px;
        }

        /* 全屏样式 */
        .cui-callkit-fullscreen {
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            right: 0 !important;
            bottom: 0 !important;
            width: 100vw !important;
            height: 100vh !important;
            max-width: none !important;
            max-height: none !important;
            border-radius: 0 !important;
            z-index: 9999 !important;
            border: none !important;
            padding: 16px;
        }

        .cui-callkit-header {
            height: 60px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            flex-shrink: 0;
        }

        .cui-callkit-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            gap: 8px;
            padding: 8px;
            overflow: hidden;
        }

        .cui-callkit-controls {
            height: 60px;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-shrink: 0;
        }

        /* 视频布局 */
        .video-layout {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .video-row {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            flex: 0 0 auto;
        }

        .video-wrapper {
            flex-shrink: 0;
            flex-grow: 0;
            border: 2px solid #ff0000;
            border-radius: 8px;
            position: relative;
        }

        .video-window {
            width: 100%;
            height: 100%;
            background: #1a1a1a;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 14px;
            font-weight: bold;
        }

        /* 控制按钮 */
        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 16px;
            height: 56px;
            padding: 0 24px;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(10px);
            border-radius: 28px;
        }

        .control-btn {
            width: 48px;
            height: 48px;
            border: none;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
            font-size: 18px;
        }

        .control-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: scale(1.05);
        }

        .control-btn.fullscreen {
            background: #007bff;
        }

        /* 信息面板 */
        .info-panel {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 10px;
            border-radius: 8px;
            font-size: 12px;
            max-width: 300px;
            z-index: 10000;
        }

        .size-info {
            margin: 5px 0;
            font-family: monospace;
        }

        .video-size {
            position: absolute;
            top: 2px;
            left: 2px;
            background: rgba(0, 0, 0, 0.8);
            color: #00ff00;
            padding: 2px 4px;
            font-size: 10px;
            border-radius: 2px;
            font-family: monospace;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="info-panel" id="infoPanel">
            <h3>CallKit 全屏模式测试</h3>
            <div class="size-info">窗口尺寸: <span id="windowSize">-</span></div>
            <div class="size-info">容器尺寸: <span id="containerSize">-</span></div>
            <div class="size-info">视频尺寸: <span id="videoSize">-</span></div>
            <div class="size-info">全屏状态: <span id="fullscreenStatus">否</span></div>
            <div class="size-info">视频数量: <span id="videoCount">4</span></div>
        </div>

        <!-- CallKit 组件 -->
        <div class="cui-callkit cui-callkit-normal" id="callkit">
            <div class="cui-callkit-header">
                <div>视频通话 - 正常模式</div>
                <div>
                    <button class="control-btn" onclick="toggleFullscreen()" id="fullscreenBtn">⛶</button>
                </div>
            </div>
            <div class="cui-callkit-content">
                <div class="video-layout" id="videoLayout">
                    <!-- 视频将通过 JavaScript 动态生成 -->
                </div>
            </div>
            <div class="cui-callkit-controls">
                <div class="controls">
                    <button class="control-btn">🎤</button>
                    <button class="control-btn">📹</button>
                    <button class="control-btn" style="background: rgba(255, 0, 0, 0.8);">📞</button>
                    <button class="control-btn">🖥️</button>
                    <button class="control-btn">🔊</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let isFullscreen = false;
        let videoCount = 4;

        // 计算视频尺寸的函数（模拟 CallKit 的计算逻辑）
        function calculateVideoSize(containerWidth, containerHeight, videoCount) {
            const headerHeight = 60;
            const controlsHeight = 60;
            const padding = 16; // 全屏时的 padding
            const gap = 8;

            const availableWidth = containerWidth - (isFullscreen ? padding * 2 : 0);
            const availableHeight = containerHeight - headerHeight - controlsHeight - (isFullscreen ? padding * 2 : 0);

            let rows, cols, itemsPerRow;

            if (videoCount <= 4) {
                rows = 1;
                cols = videoCount;
                itemsPerRow = [videoCount];
            } else if (videoCount <= 12) {
                rows = 2;
                if (videoCount <= 8) {
                    cols = 4;
                    itemsPerRow = [4, videoCount - 4];
                } else if (videoCount <= 10) {
                    cols = 5;
                    itemsPerRow = [5, videoCount - 5];
                } else {
                    cols = 6;
                    itemsPerRow = [6, videoCount - 6];
                }
            } else {
                rows = 3;
                cols = 6;
                itemsPerRow = [6, 6, videoCount - 12];
            }

            const totalRowGaps = Math.max(0, rows - 1) * gap;
            const videoContainerHeight = availableHeight - totalRowGaps;
            const heightPerRow = videoContainerHeight / rows;

            const firstRowCount = itemsPerRow[0] || 1;
            const totalWidthGaps = (firstRowCount - 1) * gap;
            const widthBasedVideoWidth = (availableWidth - totalWidthGaps) / firstRowCount;
            const widthBasedVideoHeight = widthBasedVideoWidth; // 正方形

            const heightBasedVideoHeight = heightPerRow;
            const heightBasedVideoWidth = heightBasedVideoHeight; // 正方形

            let finalVideoWidth, finalVideoHeight;

            if (widthBasedVideoHeight <= heightPerRow) {
                finalVideoWidth = widthBasedVideoWidth;
                finalVideoHeight = widthBasedVideoHeight;
            } else {
                finalVideoWidth = heightBasedVideoWidth;
                finalVideoHeight = heightBasedVideoHeight;
            }

            // 确保最小尺寸
            finalVideoWidth = Math.max(100, finalVideoWidth);
            finalVideoHeight = Math.max(100, finalVideoHeight);

            return {
                width: finalVideoWidth,
                height: finalVideoHeight,
                rows,
                cols,
                itemsPerRow
            };
        }

        // 渲染视频布局
        function renderVideoLayout() {
            const callkit = document.getElementById('callkit');
            const videoLayout = document.getElementById('videoLayout');
            const rect = callkit.getBoundingClientRect();

            const containerWidth = rect.width;
            const containerHeight = rect.height;

            const videoInfo = calculateVideoSize(containerWidth, containerHeight, videoCount);

            // 清空现有内容
            videoLayout.innerHTML = '';

            // 创建视频行
            let videoIndex = 0;
            videoInfo.itemsPerRow.forEach((rowCount, rowIndex) => {
                const row = document.createElement('div');
                row.className = 'video-row';

                for (let i = 0; i < rowCount; i++) {
                    const wrapper = document.createElement('div');
                    wrapper.className = 'video-wrapper';
                    wrapper.style.width = `${videoInfo.width}px`;
                    wrapper.style.height = `${videoInfo.height}px`;

                    const window = document.createElement('div');
                    window.className = 'video-window';
                    window.textContent = `视频 ${videoIndex + 1}`;

                    const sizeInfo = document.createElement('div');
                    sizeInfo.className = 'video-size';
                    sizeInfo.textContent = `${Math.round(videoInfo.width)}×${Math.round(videoInfo.height)}`;

                    wrapper.appendChild(window);
                    wrapper.appendChild(sizeInfo);
                    row.appendChild(wrapper);

                    videoIndex++;
                }

                videoLayout.appendChild(row);
            });

            // 更新信息面板
            updateInfoPanel(containerWidth, containerHeight, videoInfo);
        }

        // 更新信息面板
        function updateInfoPanel(containerWidth, containerHeight, videoInfo) {
            document.getElementById('windowSize').textContent = `${window.innerWidth}×${window.innerHeight}`;
            document.getElementById('containerSize').textContent = `${Math.round(containerWidth)}×${Math.round(containerHeight)}`;
            document.getElementById('videoSize').textContent = `${Math.round(videoInfo.width)}×${Math.round(videoInfo.height)}`;
            document.getElementById('fullscreenStatus').textContent = isFullscreen ? '是' : '否';
            document.getElementById('videoCount').textContent = videoCount;
        }

        // 切换全屏
        function toggleFullscreen() {
            const callkit = document.getElementById('callkit');
            const header = callkit.querySelector('.cui-callkit-header div');
            const btn = document.getElementById('fullscreenBtn');

            isFullscreen = !isFullscreen;

            if (isFullscreen) {
                callkit.className = 'cui-callkit cui-callkit-fullscreen';
                header.textContent = '视频通话 - 全屏模式';
                btn.textContent = '⛶';
                btn.classList.add('fullscreen');
            } else {
                callkit.className = 'cui-callkit cui-callkit-normal';
                header.textContent = '视频通话 - 正常模式';
                btn.textContent = '⛶';
                btn.classList.remove('fullscreen');
            }

            // 延迟重新渲染，等待 CSS 过渡完成
            setTimeout(renderVideoLayout, 100);
        }

        // 改变视频数量
        function changeVideoCount(count) {
            videoCount = count;
            renderVideoLayout();
        }

        // 监听窗口大小变化
        window.addEventListener('resize', () => {
            setTimeout(renderVideoLayout, 100);
        });

        // 添加键盘快捷键
        document.addEventListener('keydown', (e) => {
            if (e.key === 'f' || e.key === 'F') {
                toggleFullscreen();
            } else if (e.key >= '1' && e.key <= '9') {
                changeVideoCount(parseInt(e.key));
            }
        });

        // 初始渲染
        setTimeout(renderVideoLayout, 500);

        // 添加控制按钮
        const infoPanel = document.getElementById('infoPanel');
        const controls = document.createElement('div');
        controls.innerHTML = `
            <div style="margin-top: 10px; padding-top: 10px; border-top: 1px solid #444;">
                <div>快捷键: F=全屏, 1-9=视频数量</div>
                <div style="margin-top: 5px;">
                    <button onclick="changeVideoCount(1)" style="margin: 2px; padding: 4px 8px; background: #007bff; color: white; border: none; border-radius: 3px; cursor: pointer;">1个</button>
                    <button onclick="changeVideoCount(4)" style="margin: 2px; padding: 4px 8px; background: #007bff; color: white; border: none; border-radius: 3px; cursor: pointer;">4个</button>
                    <button onclick="changeVideoCount(9)" style="margin: 2px; padding: 4px 8px; background: #007bff; color: white; border: none; border-radius: 3px; cursor: pointer;">9个</button>
                    <button onclick="changeVideoCount(12)" style="margin: 2px; padding: 4px 8px; background: #007bff; color: white; border: none; border-radius: 3px; cursor: pointer;">12个</button>
                </div>
            </div>
        `;
        infoPanel.appendChild(controls);
    </script>
</body>

</html>
